  "Die Reinigungskosten beim Taxiunternehmer einfordern — nicht beim Fahrgast.",
  "Nichts — Verschmutzungen durch Fahrgäste sind versicherungsrechtlich abgedeckt."
],correct:0,
explain:"Wenn Fahrgast das Taxi beschmutzt: ein ANGEMESSENES ENTGELT für die erforderliche Reinigung verlangen. Direkt vom Fahrgast, nicht von der Versicherung, nicht von der Polizei."},

// ── 44 ──────────────────────────────────────────────────────────────────────
{q:"44.) Dürfen Sie als Taxilenker Ihren eigenen Hund im Taxi mitbefördern?",
opts:[
  "Nein — Tiere, deren Halter nicht der Fahrgast oder der Auftraggeber ist, dürfen im Taxi nicht mitbefördert werden.",
  "Ja — der Taxilenker darf seinen eigenen Hund immer dabei haben.",
  "Ja — aber nur wenn keine Fahrgäste im Taxi sind.",
  "Nur wenn der Hund einen Maulkorb trägt und der Fahrgast einverstanden ist."
],correct:0,
explain:"NEIN! Tiere dürfen nur mitbefördert werden, wenn deren Halter der FAHRGAST oder AUFTRAGGEBER ist. Der eigene Hund des Taxilenkers darf NICHT im Taxi mitbefördert werden — egal ob Fahrgäste dabei sind oder nicht."}

]; // Ende Q

// ═══════════════════════════════════════════════
//  LOGIC
// ═══════════════════════════════════════════════
let order=[], current=0, answered=false, correct=0, wrong=0, wrongSet=new Set(), mode='all';

function init(m){
  mode=m||'all'; current=0; correct=0; wrong=0; answered=false;
  order=(mode==='wrong'&&wrongSet.size>0)?[...wrongSet]:Q.map((_,i)=>i);
  updateStats(); render();
}
function shuffleQ(){
  mode='all'; setActive('m-shuffle'); current=0; correct=0; wrong=0; answered=false;
  order=Q.map((_,i)=>i).sort(()=>Math.random()-0.5);
  updateStats(); render();
}
function setMode(m){
  mode=m; wrongSet=new Set();
  setActive(m==='all'?'m-all':'m-wrong'); init(m);
}
function setActive(id){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id); if(el)el.classList.add('active');
}

function render(){
  if(current>=order.length){showResult();return;}
  const idx=order[current], q=Q[idx];
  const pct=Math.round(((current+1)/order.length)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('top-info').textContent='Frage '+(current+1)+' von '+order.length;

  const indices=[0,1,2,3];
  const shuffled=indices.sort(()=>Math.random()-0.5);
  const correctDisplay=shuffled.indexOf(q.correct);

  let html=`<div class="q-card">
    <div class="q-category">🚖 Wiener Landesbetriebsordnung</div>
    <div class="q-number">Frage ${current+1} von ${order.length}</div>
    <div class="q-text">${q.q.replace(/\n/g,'<br>')}</div>`;

  shuffled.forEach((origIdx,displayIdx)=>{
    html+=`<div class="option" id="opt${displayIdx}" onclick="pick(${displayIdx},${correctDisplay})">
      <div class="checkbox" id="cb${displayIdx}"></div>
      <div class="opt-text">${q.opts[origIdx]}</div>
    </div>`;
  });

  html+=`<div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-orange" id="btn-w" onclick="next()" disabled>Weiter →</button>
    </div>
  </div>`;

  document.getElementById('quiz-area').innerHTML=html;
  answered=false;
}

function pick(chosen, correctDisplay){
  if(answered)return; answered=true;
  const idx=order[current], q=Q[idx];
  for(let j=0;j<4;j++){
    const el=document.getElementById('opt'+j), cb=document.getElementById('cb'+j);
    el.classList.add('disabled');
    if(j===chosen&&j===correctDisplay){el.classList.add('correct');cb.textContent='✓';}
    else if(j===chosen){el.classList.add('wrong');cb.textContent='✗';}
    else if(j===correctDisplay){el.classList.add('reveal');cb.textContent='✓';}
  }
  const fb=document.getElementById('feedback');
  if(chosen===correctDisplay){
    correct++;
    fb.className='feedback show ok';
    fb.innerHTML='✓ <strong>Richtig!</strong> — '+q.explain;
  } else {
    wrong++;
    wrongSet.add(idx);
    fb.className='feedback show ko';
    fb.innerHTML='✗ <strong>Falsch.</strong> — '+q.explain;
  }
  document.getElementById('btn-w').disabled=false;
  updateStats();
}

function next(){current++;render();}

function updateStats(){
  document.getElementById('s-total').textContent=current;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
}

function showResult(){
  const total=order.length, pct=Math.round((correct/total)*100), pass=pct>=75;
  document.getElementById('prog-fill').style.width='100%';
  document.getElementById('top-info').textContent='Fertig!';
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-wrong').textContent=wrong;
  document.getElementById('quiz-area').innerHTML=`<div class="q-card result-screen">
    <div class="q-category">🚖 Ergebnis</div>
    <div class="big">${correct}/${total}</div>
    <div class="sub">${pct}% richtig beantwortet</div>
    <div class="pass-badge ${pass?'pass':'fail'}">${pass?'✓ Bestanden':'✗ Nicht bestanden — weiter üben!'}</div>
    <div style="margin-top:24px;font-size:14px;color:#666;line-height:1.8">
      ${wrong>0
        ? `Du hast <strong>${wrong}</strong> Fragen falsch beantwortet.<br>Klicke <em>"Nur Falsche"</em> um sie nochmal zu üben!`
        : '🎉 Perfekt! Alle Betriebsordnung-Fragen richtig beantwortet!'}
    </div>
    <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-orange" onclick="init('all')">Nochmal (alle) ↺</button>
      ${wrong>0?`<button class="btn btn-blue" onclick="setMode('wrong')">Nur Falsche üben</button>`:''}
    </div>
  </div>`;
}

init('all');
</script>
</body>
</html>
